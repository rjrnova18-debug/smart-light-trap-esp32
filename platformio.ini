; Light Trap — firmware de la trampa de luz (ESP32 DOIT DevKit V1)
;
;   Compilar:          pio run
;   Subir por cable:   pio run -t upload
;   Monitor serie:     pio device monitor
;   Subir por WiFi:    conectarse al AP de la trampa, abrir http://192.168.4.1/admin
;                      y subir .pio/build/esp32doit-devkit-v1/firmware.bin
;
; Antes de compilar: copiar include/secrets.example.h como include/secrets.h.
; El dashboard (web/) se comprime y se embebe solo al compilar (tools/embed_web.py).

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
; Versión fija: el build es reproducible (Arduino core 2.0.17) y LittleFS no cambia de API
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
; Tabla por defecto (fijada a propósito): app0/app1 de 1,25 MB para la OTA y la partición
; "spiffs" (0x290000, 1,375 MB) para el respaldo LittleFS. Cambiarla mueve o borra el respaldo.
board_build.partitions = default.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BME280 Library@^2.2.2
	adafruit/RTClib@^2.0.3
	bblanchon/ArduinoJson@^7.0.4
	adafruit/Adafruit INA219@^1.2.0
monitor_speed = 115200
upload_speed = 921600
